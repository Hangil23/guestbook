# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-01

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crhgk01.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_72B4D07859B94EE6B571BF276CEC3D65 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_20240DA329E74AD38F70B55C03D3B362 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crhgk01.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_72B4D07859B94EE6B571BF276CEC3D65 }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-01'
          slot-name: 'staging'
          images: 'crhgk01.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_72B4D07859B94EE6B571BF276CEC3D65 }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3902395D9F2243629C265C2800B411CB }}